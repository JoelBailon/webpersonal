{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión - Transporto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body class="min-h-screen bg-gradient-to-r from-green-200 to-blue-200 flex flex-col items-center justify-start p-6">

  <header class="fixed top-4 left-4 flex items-center space-x-3 z-50">
    <img src="https://img.icons8.com/?size=160&id=AA5D5GKwWD38&format=png" alt="Logo" class="w-14 h-14" />
    <div>
      <h1 class="text-3xl font-bold text-black leading-none">TRANSPORTO</h1>
      <p class="italic text-blue-800 text-sm leading-tight">La forma inteligente de moverse</p>
    </div>
  </header>

  <main class="mt-28 w-full max-w-4xl">
    <div class="bg-white bg-opacity-40 backdrop-blur-md p-10 rounded-3xl shadow-xl w-full max-w-md mx-auto">
      <h2 class="text-2xl font-bold text-center text-black-900 mb-8">Iniciar Sesión</h2>

      <form method="post" class="space-y-6" id="formLoginNormal">
        {% csrf_token %}
        <div>
          <label for="username_or_email" class="block text-lg font-bold mb-1">Nombre de Usuario o Correo Electrónico</label>
          <input
            type="text"
            id="username_or_email"
            name="username_or_email"
            class="w-full p-3 rounded-lg bg-white"
            placeholder="Nombre de Usuario o Correo Electrónico"
            required
          />
        </div>

        <div>
          <label for="password" class="block text-lg font-bold mb-1">Contraseña</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              class="w-full p-3 rounded-lg bg-white pr-12"
              placeholder="Contraseña"
              required
              aria-describedby="togglePassword"
            />
            <button
              type="button"
              id="togglePassword"
              aria-label="Mostrar u ocultar contraseña"
              class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-gray-300 hover:bg-gray-400 px-3 py-1 rounded-lg text-sm font-bold transition"
            >
              👁️
            </button>
          </div>
        </div>

        <div>
          <button
            type="submit"
            class="w-full bg-blue-700 text-white font-bold py-3 rounded hover:bg-blue-800 transition"
          >
            Iniciar Sesión
          </button>
        </div>

        <div class="mt-4 text-center">
          <a href="#" onclick="document.getElementById('modalRecuperar').classList.remove('hidden')"
             class="text-blue-600 hover:underline font-semibold cursor-pointer">¿Olvidaste tu contraseña?</a>
        </div>
      </form>

      <!-- Botón para reconocimiento facial -->
      <div class="mt-6 text-center">
        <button
          id="btnReconocimientoFacial"
          type="button"
          class="w-full bg-blue-700 text-white font-bold py-3 rounded hover:bg-blue-800 transition"
          onclick="abrirCamaraYCapturar()"
        >
          Iniciar Sesión con Reconocimiento Facial
        </button>
      </div>

      <video id="video" autoplay playsinline class="hidden rounded-lg shadow-lg w-full max-w-md mx-auto mt-4"></video>
      <canvas id="canvas" class="hidden"></canvas>
      <div id="mensaje" class="mt-4 text-red-600 font-semibold text-center"></div>

      <div class="mt-6 flex justify-center items-center space-x-2">
        <p class="text-black font-semibold">¿No tienes cuenta?</p>
        <a href="{% url 'registro' %}" class="text-blue-600 hover:underline font-semibold cursor-pointer">Regístrate</a>
      </div>
    </div>
  </main>

  <div id="modalRecuperar" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 w-full max-w-md">
      <h3 class="text-xl font-bold mb-4 text-center text-blue-900">Recuperar Contraseña</h3>
      <form method="post" action="{% url 'recuperar_contrasena' %}">
        {% csrf_token %}
        <div class="mb-4">
          <label class="block mb-2 font-semibold text-gray-700">Correo o nombre de usuario:</label>
          <input name="usuario_recuperacion" required class="w-full p-2 border rounded" type="text" placeholder="Correo o nombre de usuario" />
        </div>
        <div class="mb-4">
          <label class="block mb-2 font-semibold text-gray-700">Nueva contraseña:</label>
          <input name="nueva_contrasena" required class="w-full p-2 border rounded" type="password" placeholder="Nueva contraseña" />
        </div>
        <div class="mb-4">
          <label class="block mb-2 font-semibold text-gray-700">Confirmar contraseña:</label>
          <input name="confirmar_contrasena" required class="w-full p-2 border rounded" type="password" placeholder="Confirmar contraseña" />
        </div>
        <div class="flex justify-end">
          <button type="submit" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800 transition font-semibold">Actualizar</button>
          <button type="button" onclick="document.getElementById('modalRecuperar').classList.add('hidden')" class="ml-2 px-4 py-2 rounded border hover:bg-gray-200 transition">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Toggle mostrar/ocultar contraseña
    document.getElementById('togglePassword').addEventListener('click', function () {
      const passwordInput = document.getElementById('password');
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.textContent = type === 'password' ? '👁️' : '👀';
    });

    async function abrirCamaraYCapturar() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const mensaje = document.getElementById('mensaje');
      const btnReconocimiento = document.getElementById('btnReconocimientoFacial');
      mensaje.textContent = '';
      btnReconocimiento.disabled = true;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.classList.remove('hidden');

        await new Promise(resolve => video.onloadedmetadata = resolve);

        mensaje.textContent = 'Cámara activada, preparando captura en 3 segundos...';

        await new Promise(r => setTimeout(r, 3000));

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        stream.getTracks().forEach(track => track.stop());
        video.classList.add('hidden');

        mensaje.textContent = 'Procesando reconocimiento facial...';

        canvas.toBlob(async (blob) => {
          const formData = new FormData();
          formData.append('foto_rostro', blob, 'foto.jpg');

          try {
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            const response = await fetch("{% url 'login_facial' %}", {
              method: 'POST',
              headers: { 'X-CSRFToken': csrfToken },
              body: formData,
            });

            if (!response.ok) throw new Error('Respuesta no OK');

            const data = await response.json();

            if (data.success) {
              console.log('Login facial exitoso, redirigiendo a:', data.redirect_url);
              mensaje.textContent = '';
              alert('¡Bienvenido! Acceso concedido.');
              window.location.href = data.redirect_url;
            } else {
              console.error('Error en login facial:', data.error);
              mensaje.textContent = data.error || 'No se pudo autenticar el rostro.';
              btnReconocimiento.disabled = false;
            }

          } catch (error) {
            mensaje.textContent = 'Error al enviar la imagen: ' + error.message;
            btnReconocimiento.disabled = false;
          }
        }, 'image/jpeg', 0.95);

      } catch (err) {
        mensaje.textContent = 'No se pudo acceder a la cámara: ' + err.message;
        btnReconocimiento.disabled = false;
      }
    }
  </script>

</body>
</html>
