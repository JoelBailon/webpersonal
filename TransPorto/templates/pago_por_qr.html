{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pago QR - Transporto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    #qr-reader {
      width: 100%;
      border-radius: 1rem;
      overflow: hidden;
    }
  </style>
</head>
<body id="body"
  class="{% if user.tema_preferido == 'dark' %}bg-blue-900 text-white{% else %}bg-gradient-to-r from-green-200 to-blue-300 text-black{% endif %} min-h-screen flex flex-col items-center justify-center px-4 py-6"
>

  <div id="contenedor"
    class="w-full max-w-md bg-white bg-opacity-40 backdrop-blur-md text-black rounded-2xl shadow-lg p-6 text-center space-y-4"
  >
    <h2 id="titulo" class="text-2xl font-bold text-black">
      Escanea el QR para Pagar
    </h2>
    <p id="descripcion" class="text-black text-sm">
      Escaneo en vivo...
    </p>

    <div id="qr-reader" class="mx-auto"></div>

    <div id="status" class="text-black font-semibold mt-4">
      Esperando escaneo...
    </div>
  </div>

  <script>
    function onScanSuccess(decodedText, decodedResult) {
      document.getElementById('status').innerText = "Código escaneado: " + decodedText + ". Procesando pago...";

      const codigoEscaneado = decodedText;
      const idCooperativaSeleccionada = {{ cooperativa.id_cooperativa }};

      fetch("{% url 'realizar_pago' %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: JSON.stringify({
          codigo_qr: codigoEscaneado,
          id_cooperativa: idCooperativaSeleccionada
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('Pago realizado con éxito');
          window.location.href = data.redirect_url || "{% url 'saldo' %}";
        } else {
          alert('Error al realizar pago: ' + data.error);
        }
      })
      .catch(error => {
        alert('Error de red: ' + error);
      });

      html5QrcodeScanner.clear();
    }

    function onScanFailure(error) {
      // Ignorar errores de escaneo frecuentes
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "qr-reader", { fps: 10, qrbox: { width: 250, height: 250 } }
    );
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  </script>

  <!-- Script para aplicar tema dinámicamente -->
  <script>
    const body = document.getElementById('body');

    function applyTheme(theme) {
      if (theme === 'dark') {
        body.classList.remove('bg-gradient-to-r', 'from-green-200', 'to-blue-300', 'text-black');
        body.classList.add('bg-blue-900', 'text-white');
      } else {
        body.classList.remove('bg-blue-900', 'text-white');
        body.classList.add('bg-gradient-to-r', 'from-green-200', 'to-blue-300', 'text-black');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || "{{ user.tema_preferido|default:'light' }}";
      applyTheme(savedTheme);
    });
  </script>

</body>
</html>
