{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rutas de Cooperativa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Poppins', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
  </style>
  <script>
    function redirectToInicio() {
      window.location.href = '{% url "inicio" %}';
    }

    function applyTheme(theme) {
      const body = document.getElementById('body');
      const headerTitle = document.getElementById('title');
      const subtitle = document.getElementById('subtitle');

      if (theme === 'dark') {
        body.classList.remove('bg-gradient-to-r', 'from-green-200', 'to-blue-200', 'text-black');
        body.classList.add('bg-blue-900', 'text-white');
        if(headerTitle) {
          headerTitle.classList.remove('text-black');
          headerTitle.classList.add('text-white');
        }
        if(subtitle) {
          subtitle.classList.remove('text-black');
          subtitle.classList.add('text-gray-300');
        }
      } else {
        body.classList.remove('bg-blue-900', 'text-white');
        body.classList.add('bg-gradient-to-r', 'from-green-200', 'to-blue-200', 'text-black');
        if(headerTitle) {
          headerTitle.classList.remove('text-white');
          headerTitle.classList.add('text-black');
        }
        if(subtitle) {
          subtitle.classList.remove('text-gray-300');
          subtitle.classList.add('text-black');
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      let savedTheme = localStorage.getItem('theme') || "{{ user.tema_preferido|default:'light' }}";
      applyTheme(savedTheme);
    });
  </script>
</head>
<body
  id="body"
  class="{% if user.tema_preferido == 'dark' %}bg-blue-900 text-white{% else %}bg-gradient-to-r from-green-200 to-blue-200 text-black{% endif %} min-h-screen flex flex-col items-center justify-start"
>

  <!-- Botón casita (ícono blanco sin fondo ideal para modo oscuro) -->
  <a href="{% url 'inicio' %}" class="fixed top-4 right-4 w-12 h-12 cursor-pointer z-50" aria-label="Inicio">
    <img src="https://img.icons8.com/ios-filled/100/ffffff/home.png" alt="Inicio" class="w-full h-full object-contain" />
  </a>


  <!-- Header fijo arriba izquierda -->
  <header class="fixed top-4 left-4 flex items-center space-x-4 z-50">
    <img src="https://img.icons8.com/?size=160&id=AA5D5GKwWD38&format=png" alt="Logo" class="w-12 h-12" />
    <div>
      <h1 id="title" class="{% if user.tema_preferido == 'dark' %}text-white{% else %}text-black{% endif %} text-2xl font-bold">TRANSPORTO</h1>
      <p id="subtitle" class="{% if user.tema_preferido == 'dark' %}text-gray-300{% else %}text-black{% endif %} italic text-sm">La forma inteligente de moverse</p>
    </div>
  </header>

  <!-- Contenido principal con padding superior -->
  <main class="w-full max-w-3xl px-6 pt-28">
    <div class="{% if user.tema_preferido == 'dark' %}bg-[#1e1a2a] bg-opacity-90{% else %}bg-white bg-opacity-40 backdrop-blur-md{% endif %} p-6 rounded-2xl shadow-lg text-black">
      <h2 class="text-2xl font-bold text-black mb-4">Rutas de {{ cooperativa.nombre }}</h2>

      <ul class="space-y-4">
        {% for ruta in rutas %}
        <li class="{% if user.tema_preferido == 'dark' %}bg-[#2b2242]{% else %}bg-white{% endif %} p-4 rounded-lg shadow-md text-black">
          <p class="text-lg font-bold text-black">{{ ruta.descripcion }}</p>
          <p class="text-black">Hora: {{ ruta.hora }}</p>
        </li>
        {% empty %}
        <li class="{% if user.tema_preferido == 'dark' %}bg-[#2b2242]{% else %}bg-white{% endif %} p-4 rounded-lg shadow-md text-center text-black">
          No hay rutas disponibles para esta cooperativa.
        </li>
        {% endfor %}
      </ul>
    </div>
  </main>

</body>
</html>
